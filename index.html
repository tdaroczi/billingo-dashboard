<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Billingo Dashboard</title>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.7/babel.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
      --text: #0f172a; --text-muted: #64748b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    button { font-family: inherit; }
    select, input { font-family: inherit; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const BASE = "/billingo-api";

const { useState, useCallback, useEffect } = React;

const fmt = (n, cur) => {
  if (cur == null) cur = "HUF";
  return n == null ? "–" : new Intl.NumberFormat("hu-HU", { style:"currency", currency:cur, maximumFractionDigits:0 }).format(n);
};
const fmtDate = d => d ? new Date(d).toLocaleDateString("hu-HU") : "–";

// ── Saját SVG chart komponensek (Recharts helyett) ──
function BarChartSimple({ data, height }) {
  height = height || 200;
  if (!data || data.length === 0) {
    return <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-muted)",fontSize:13}}>Nincs elég adat</div>;
  }
  const max = Math.max.apply(null, data.map(d => d.value)) || 1;
  const padTop = 15, padBot = 30, padLeft = 50, padRight = 10;
  const W = 500, H = height;
  const innerW = W - padLeft - padRight;
  const innerH = H - padTop - padBot;
  const step = innerW / data.length;
  const barW = step * 0.65;

  const yTicks = [0, 0.25, 0.5, 0.75, 1].map(t => ({
    value: max * t,
    y: padTop + innerH - innerH * t
  }));

  return (
    <svg width="100%" height={H} viewBox={"0 0 " + W + " " + H} preserveAspectRatio="none">
      {yTicks.map((t,i) => (
        <g key={i}>
          <line x1={padLeft} y1={t.y} x2={W - padRight} y2={t.y} stroke="var(--border)" strokeDasharray="3 3"/>
          <text x={padLeft - 5} y={t.y + 3} fontSize="10" fill="var(--text-muted)" textAnchor="end">
            {(t.value/1000).toFixed(0) + "k"}
          </text>
        </g>
      ))}
      {data.map((d, i) => {
        const h = (d.value / max) * innerH;
        const x = padLeft + step * i + (step - barW)/2;
        const y = padTop + innerH - h;
        return (
          <g key={i}>
            <title>{d.label + ": " + fmt(d.value)}</title>
            <rect x={x} y={y} width={barW} height={h} fill="#6366f1" rx="3"/>
            <text x={x + barW/2} y={H - 12} fontSize="10" textAnchor="middle" fill="var(--text-muted)">
              {d.label}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function PieChartSimple({ data, size }) {
  size = size || 180;
  if (!data || data.length === 0) {
    return <div style={{height:size,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-muted)",fontSize:13}}>Nincs adat</div>;
  }
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  let cumA = -Math.PI / 2;
  const cx = size / 2, cy = size / 2, r = size / 2 - 5;
  const lr = r * 0.62;

  const slices = data.map((d, i) => {
    const angle = (d.value / total) * 2 * Math.PI;
    const x1 = cx + r * Math.cos(cumA);
    const y1 = cy + r * Math.sin(cumA);
    const x2 = cx + r * Math.cos(cumA + angle);
    const y2 = cy + r * Math.sin(cumA + angle);
    const largeArc = angle > Math.PI ? 1 : 0;
    const labelA = cumA + angle / 2;
    const lx = cx + lr * Math.cos(labelA);
    const ly = cy + lr * Math.sin(labelA);
    const pct = Math.round((d.value/total)*100);
    let path;
    if (data.length === 1) {
      path = "M " + (cx-r) + " " + cy + " A " + r + " " + r + " 0 1 1 " + (cx+r) + " " + cy + " A " + r + " " + r + " 0 1 1 " + (cx-r) + " " + cy + " Z";
    } else {
      path = "M " + cx + " " + cy + " L " + x1 + " " + y1 + " A " + r + " " + r + " 0 " + largeArc + " 1 " + x2 + " " + y2 + " Z";
    }
    cumA += angle;
    return { path, pct, lx, ly, color: d.color, name: d.name, value: d.value };
  });

  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:20,flexWrap:"wrap"}}>
      <svg width={size} height={size} viewBox={"0 0 " + size + " " + size}>
        {slices.map((s,i) => (
          <g key={i}>
            <title>{s.name + ": " + s.value + " (" + s.pct + "%)"}</title>
            <path d={s.path} fill={s.color}/>
            {s.pct > 7 && (
              <text x={s.lx} y={s.ly} fontSize="11" fontWeight="700" fill="white" textAnchor="middle" dominantBaseline="middle">
                {s.pct + "%"}
              </text>
            )}
          </g>
        ))}
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:6,minWidth:120}}>
        {data.map((d,i) => (
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--text-muted)"}}>
            <div style={{width:12,height:12,borderRadius:3,background:d.color,flexShrink:0}}/>
            <span style={{flex:1}}>{d.name}</span>
            <strong style={{color:"var(--text)"}}>{d.value}</strong>
          </div>
        ))}
      </div>
    </div>
  );
}

function StatusBadge({ status }) {
  const cfg = {
    paid: {l:"Fizetve", c:"#d1fae5 #065f46"},
    unpaid: {l:"Fizetetlen", c:"#fef3c7 #92400e"},
    expired: {l:"Lejárt", c:"#fee2e2 #991b1b"},
    cancelled: {l:"Sztornó", c:"#f1f5f9 #475569"},
    draft: {l:"Piszkozat", c:"#dbeafe #1e40af"}
  };
  const s = cfg[status] || {l:status, c:"#f1f5f9 #475569"};
  const parts = s.c.split(" ");
  return <span style={{background:parts[0],color:parts[1],padding:"2px 8px",borderRadius:999,fontSize:11,fontWeight:700}}>{s.l}</span>;
}

function KpiCard({ icon, label, value, sub, color }) {
  return (
    <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:20,display:"flex",flexDirection:"column",gap:8}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:"var(--text-muted)"}}>{label}</span>
        <div style={{background:color+"20",borderRadius:10,padding:6,fontSize:18}}>{icon}</div>
      </div>
      <div style={{fontSize:22,fontWeight:800,color:"var(--text)"}}>{value}</div>
      {sub ? <div style={{fontSize:12,color:"var(--text-muted)"}}>{sub}</div> : null}
    </div>
  );
}

function ErrorScreen({ error, onRetry }) {
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,background:"var(--bg)"}}>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:24,padding:40,maxWidth:480,boxShadow:"0 20px 60px rgba(0,0,0,0.08)"}}>
        <div style={{fontSize:48,textAlign:"center",marginBottom:12}}>⚠️</div>
        <h1 style={{margin:"0 0 8px",fontSize:22,fontWeight:800,textAlign:"center"}}>Nem sikerült csatlakozni</h1>
        <p style={{color:"var(--text-muted)",fontSize:14,textAlign:"center",marginTop:0}}>{error || "Ismeretlen hiba"}</p>
        <div style={{background:"#fef3c7",border:"1px solid #fbbf24",borderRadius:12,padding:14,fontSize:13,color:"#78350f",marginTop:16}}>
          <strong>Ellenőrizd:</strong>
          <ul style={{margin:"6px 0 0",paddingLeft:20,lineHeight:1.6}}>
            <li>Netlify → Site settings → <strong>Environment variables</strong></li>
            <li>Van-e <code style={{background:"#fde68a",padding:"1px 5px",borderRadius:4}}>BILLINGO_API_KEY</code> változó?</li>
            <li>Helyes az értéke?</li>
            <li>Új deploy lefutott a változtatás után?</li>
          </ul>
        </div>
        <button onClick={onRetry} style={{width:"100%",padding:"12px",borderRadius:12,border:"none",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"white",fontWeight:700,fontSize:14,cursor:"pointer",marginTop:16}}>
          🔄 Újrapróbálkozás
        </button>
      </div>
    </div>
  );
}

function InvoiceRow({ d, onView }) {
  const typeLabel = { invoice:"Számla", proforma:"Díjbekérő", draft:"Piszkozat", advance:"Előleg", receipt:"Nyugta" };
  return (
    <tr style={{borderBottom:"1px solid var(--border)"}}>
      <td style={{padding:"10px 12px",fontFamily:"monospace",fontWeight:700,fontSize:12,color:"var(--text)"}}>{d.invoice_number||"–"}</td>
      <td style={{padding:"10px 12px",fontWeight:600,fontSize:13,color:"var(--text)"}}>{(d.partner && d.partner.name) || "–"}</td>
      <td style={{padding:"10px 12px",fontSize:13,color:"var(--text-muted)"}}>{typeLabel[d.type]||d.type}</td>
      <td style={{padding:"10px 12px",fontSize:13,color:"var(--text-muted)"}}>{fmtDate(d.invoice_date)}</td>
      <td style={{padding:"10px 12px",fontSize:13,color:d.payment_status==="expired"?"#ef4444":"var(--text-muted)"}}>{fmtDate(d.due_date)}</td>
      <td style={{padding:"10px 12px",fontWeight:700,fontSize:13,color:"var(--text)"}}>{fmt(d.summary && d.summary.gross_price, d.currency)}</td>
      <td style={{padding:"10px 12px"}}><StatusBadge status={d.payment_status}/></td>
      <td style={{padding:"10px 12px"}}><button onClick={()=>onView(d)} style={{background:"#6366f110",border:"none",borderRadius:8,padding:"4px 8px",color:"#6366f1",cursor:"pointer",fontSize:12}}>👁 Részlet</button></td>
    </tr>
  );
}

function Modal({ doc, onClose }) {
  if (!doc) return null;
  const summary = doc.summary || {};
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:20,width:"100%",maxWidth:500,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 25px 50px rgba(0,0,0,0.2)"}}>
        <div style={{padding:"20px 24px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontWeight:800,fontSize:17,color:"var(--text)"}}>{doc.invoice_number||"Piszkozat"}</div>
            <div style={{fontSize:13,color:"var(--text-muted)"}}>{doc.partner && doc.partner.name}</div>
          </div>
          <button onClick={onClose} style={{border:"none",background:"var(--bg)",borderRadius:10,padding:"6px 10px",cursor:"pointer",fontSize:16}}>✕</button>
        </div>
        <div style={{padding:24,display:"flex",flexDirection:"column",gap:16}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[["Típus",doc.type],["Státusz",doc.payment_status],["Kiállítás",fmtDate(doc.invoice_date)],["Lejárat",fmtDate(doc.due_date)],["Fizetve",fmtDate(doc.paid_date)],["Fizetési mód",doc.payment_method]].map(([l,v])=>(
              <div key={l} style={{background:"var(--bg)",borderRadius:10,padding:"10px 12px"}}>
                <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:3}}>{l}</div>
                <div style={{fontWeight:700,fontSize:13,color:"var(--text)"}}>{v||"–"}</div>
              </div>
            ))}
          </div>
          <div style={{background:"var(--bg)",borderRadius:12,padding:16}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:"var(--text-muted)",marginBottom:12}}>Összesítő</div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:14}}>
              <span style={{color:"var(--text-muted)"}}>Nettó</span>
              <span>{fmt(summary.net_price,doc.currency)}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:12,fontSize:14}}>
              <span style={{color:"var(--text-muted)"}}>ÁFA</span>
              <span>{fmt((summary.gross_price||0)-(summary.net_price||0),doc.currency)}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:16,fontWeight:800,borderTop:"1px solid var(--border)",paddingTop:12}}>
              <span>Bruttó</span>
              <span style={{color:"#6366f1"}}>{fmt(summary.gross_price,doc.currency)}</span>
            </div>
          </div>
          <a href={"https://app.billingo.hu/szamlak/" + doc.id} target="_blank" rel="noreferrer"
            style={{display:"block",textAlign:"center",padding:"12px",borderRadius:12,background:"#6366f1",color:"white",fontWeight:700,textDecoration:"none",fontSize:14}}>
            Megnyitás Billingóban ↗
          </a>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [org, setOrg] = useState(null);
  const [docs, setDocs] = useState([]);
  const [partners, setPartners] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [tab, setTab] = useState("overview");
  const [selectedDoc, setSelectedDoc] = useState(null);
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");

  const fetchAll = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      const headers = { Accept: "application/json" };
      const safeFetch = async (url) => {
        const r = await fetch(url, {headers});
        if (!r.ok) {
          const txt = await r.text();
          let parsed;
          try { parsed = JSON.parse(txt); } catch (_) { parsed = null; }
          let msg;
          if (!parsed) {
            msg = txt || ("HTTP " + r.status);
          } else if (typeof parsed === "string") {
            msg = parsed;
          } else if (typeof parsed.error === "string") {
            msg = parsed.error;
            if (parsed.details) msg += " — " + parsed.details;
          } else if (parsed.message) {
            msg = parsed.message;
          } else {
            msg = JSON.stringify(parsed);
          }
          throw new Error(msg);
        }
        return r.json();
      };

      const results = await Promise.all([
        safeFetch(BASE + "/organization"),
        safeFetch(BASE + "/documents?per_page=100&page=1"),
        safeFetch(BASE + "/documents?per_page=100&page=2").catch(()=>({data:[]})),
        safeFetch(BASE + "/documents?per_page=100&page=3").catch(()=>({data:[]})),
        safeFetch(BASE + "/partners?per_page=100&page=1"),
        safeFetch(BASE + "/partners?per_page=100&page=2").catch(()=>({data:[]})),
      ]);
      const orgR = results[0], d1 = results[1], d2 = results[2], d3 = results[3], p1 = results[4], p2 = results[5];
      setOrg(orgR);
      setDocs([].concat(d1.data||[], d2.data||[], d3.data||[]));
      setPartners([].concat(p1.data||[], p2.data||[]));
    } catch(e) {
      console.error(e);
      setError(e.message);
    }
    setLoading(false);
  }, []);

  useEffect(() => { fetchAll(); }, [fetchAll]);

  if (error) return <ErrorScreen error={error} onRetry={fetchAll}/>;

  if (loading && !org) {
    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
        <div style={{width:48,height:48,borderRadius:14,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:900,fontSize:24}}>B</div>
        <div style={{color:"var(--text-muted)",fontSize:14}}>Billingo adatok betöltése...</div>
      </div>
    );
  }

  const paid = docs.filter(d=>d.payment_status==="paid");
  const unpaid = docs.filter(d=>d.payment_status==="unpaid");
  const expired = docs.filter(d=>d.payment_status==="expired");

  const monthly = {};
  paid.forEach(d => {
    const k = (d.paid_date || d.invoice_date || "").substring(0,7);
    if (k) monthly[k] = (monthly[k]||0) + ((d.summary && d.summary.gross_price)||0);
  });
  const monthlyData = Object.entries(monthly).sort().slice(-12).map(([k,v])=>({label: k.substring(2).replace("-","."), value: Math.round(v)}));

  const statusData = [
    {name:"Fizetve", value:paid.length, color:"#10b981"},
    {name:"Fizetetlen", value:unpaid.length, color:"#f59e0b"},
    {name:"Lejárt", value:expired.length, color:"#ef4444"},
  ].filter(d=>d.value>0);

  const filtered = docs.filter(d => {
    const q = search.toLowerCase();
    const partnerName = (d.partner && d.partner.name) || "";
    const matchSearch = !q || partnerName.toLowerCase().indexOf(q) >= 0 || (d.invoice_number||"").toLowerCase().indexOf(q) >= 0;
    const matchStatus = statusFilter === "all" || d.payment_status === statusFilter;
    return matchSearch && matchStatus;
  });

  const navStyle = (id) => ({
    display:"flex", alignItems:"center", gap:10, padding:"10px 14px", borderRadius:12,
    cursor:"pointer", border:"none", width:"100%", textAlign:"left", fontSize:14, fontWeight:600,
    background: tab===id ? "#6366f120" : "transparent",
    color: tab===id ? "#6366f1" : "var(--text-muted)"
  });

  const selectStyle = {padding:"8px 12px",borderRadius:10,border:"1px solid var(--border)",background:"var(--bg)",color:"var(--text)",fontSize:13,outline:"none"};

  const tabTitles = { overview:"Áttekintés", invoices:"Számlák", partners:"Partnerek" };

  return (
    <div style={{minHeight:"100vh",display:"flex"}}>
      <div style={{width:220,flexShrink:0,background:"var(--card)",borderRight:"1px solid var(--border)",display:"flex",flexDirection:"column",padding:"24px 12px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"0 8px",marginBottom:32}}>
          <div style={{width:36,height:36,borderRadius:10,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"white",fontWeight:900,fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>B</div>
          <div style={{fontWeight:800,fontSize:13,color:"var(--text)"}}>Billingo<br/><span style={{fontWeight:400,fontSize:11,color:"var(--text-muted)"}}>Dashboard</span></div>
        </div>
        {[["overview","📊","Áttekintés"],["invoices","📄","Számlák"],["partners","👥","Partnerek"]].map(([id,ic,lb])=>(
          <button key={id} onClick={()=>setTab(id)} style={navStyle(id)}>{ic + " " + lb}</button>
        ))}
        <div style={{marginTop:"auto"}}>
          <button onClick={fetchAll} disabled={loading} style={Object.assign({}, navStyle(""), {color:"#6366f1",background:"transparent"})}>
            🔄 {loading ? "Töltés..." : "Frissítés"}
          </button>
        </div>
      </div>

      <div style={{flex:1,overflow:"auto"}}>
        <div style={{maxWidth:900,margin:"0 auto",padding:"32px 24px"}}>
          <h1 style={{fontSize:22,fontWeight:800,color:"var(--text)",marginBottom:4}}>
            {tabTitles[tab]}
          </h1>
          <p style={{color:"var(--text-muted)",fontSize:13,marginBottom:28}}>{docs.length} számla · {partners.length} partner</p>

          {tab==="overview" && (
            <div style={{display:"flex",flexDirection:"column",gap:24}}>
              {org && (
                <div style={{background:"linear-gradient(135deg,#6366f1,#8b5cf6)",borderRadius:20,padding:24,color:"white",display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
                  <div style={{width:52,height:52,borderRadius:14,background:"rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,fontWeight:900}}>
                    {(org.name && org.name[0]) || "B"}
                  </div>
                  <div style={{flex:1,minWidth:200}}>
                    <div style={{fontWeight:800,fontSize:19}}>{org.name || ("Adószám: " + (org.tax_code || "–"))}</div>
                    <div style={{opacity:.85,fontSize:13,marginTop:2}}>
                      {org.tax_code ? ("Adószám: " + org.tax_code) : null}
                      {org.subscription && org.subscription.features && org.subscription.features.indexOf("billingo_business") >= 0 ? " · Business" : null}
                      {org.has_nav_connection ? " · NAV ✓" : null}
                    </div>
                  </div>
                </div>
              )}
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:16}}>
                <KpiCard icon="💰" label="Bevétel (fizetve)" value={fmt(paid.reduce((s,d)=>s+((d.summary&&d.summary.gross_price)||0),0))} sub={paid.length + " kifizetett"} color="#10b981"/>
                <KpiCard icon="⏳" label="Kintlévőség" value={fmt(unpaid.reduce((s,d)=>s+((d.summary&&d.summary.gross_price)||0),0))} sub={unpaid.length + " fizetetlen"} color="#f59e0b"/>
                <KpiCard icon="🔴" label="Lejárt" value={fmt(expired.reduce((s,d)=>s+((d.summary&&d.summary.gross_price)||0),0))} sub={expired.length + " db"} color="#ef4444"/>
                <KpiCard icon="👥" label="Partnerek" value={partners.length} sub="aktív ügyfél" color="#6366f1"/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:20}}>
                <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:20}}>
                  <div style={{fontWeight:700,marginBottom:16,color:"var(--text)"}}>Havi bevétel (fizetve)</div>
                  <BarChartSimple data={monthlyData} height={200}/>
                </div>
                <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:20}}>
                  <div style={{fontWeight:700,marginBottom:16,color:"var(--text)"}}>Státusz megoszlás</div>
                  <PieChartSimple data={statusData} size={180}/>
                </div>
              </div>
              {expired.length > 0 && (
                <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:20}}>
                  <div style={{fontWeight:700,marginBottom:12,color:"var(--text)"}}>⚠️ Lejárt számlák</div>
                  {expired.slice().sort((a,b)=>((b.summary&&b.summary.gross_price)||0)-((a.summary&&a.summary.gross_price)||0)).slice(0,5).map(d=>(
                    <div key={d.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
                      <div>
                        <div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{(d.partner && d.partner.name) || "–"}</div>
                        <div style={{fontSize:11,color:"var(--text-muted)"}}>{d.invoice_number} · Lejárt: {fmtDate(d.due_date)}</div>
                      </div>
                      <div style={{fontWeight:800,color:"#ef4444",fontSize:14}}>{fmt(d.summary && d.summary.gross_price, d.currency)}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {tab==="invoices" && (
            <div style={{display:"flex",flexDirection:"column",gap:16}}>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍  Partner vagy számlaszám..." style={Object.assign({}, selectStyle, {flex:1,minWidth:200})}/>
                <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={selectStyle}>
                  <option value="all">Minden státusz</option>
                  <option value="paid">Fizetve</option>
                  <option value="unpaid">Fizetetlen</option>
                  <option value="expired">Lejárt</option>
                </select>
                <span style={{fontSize:12,color:"var(--text-muted)",marginLeft:"auto"}}>{filtered.length} db</span>
              </div>
              <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,overflow:"hidden"}}>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse"}}>
                    <thead>
                      <tr style={{borderBottom:"1px solid var(--border)"}}>
                        {["Számlaszám","Partner","Típus","Dátum","Lejárat","Összeg","Státusz",""].map(h=>(
                          <th key={h} style={{padding:"12px",textAlign:"left",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,color:"var(--text-muted)"}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {filtered.length===0 ? (
                        <tr><td colSpan={8} style={{textAlign:"center",padding:40,color:"var(--text-muted)",fontSize:13}}>Nincs találat</td></tr>
                      ) : filtered.map(d=><InvoiceRow key={d.id} d={d} onView={setSelectedDoc}/>)}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {tab==="partners" && (
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:16}}>
              {partners.map(p=>(
                <div key={p.id} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:16,display:"flex",gap:12}}>
                  <div style={{width:40,height:40,borderRadius:10,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"white",fontWeight:900,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    {((p.name||"?")[0]||"").toUpperCase()}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:13,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div>
                    {p.address && <div style={{fontSize:11,color:"var(--text-muted)",marginTop:2}}>{p.address.city}</div>}
                    {p.taxcode && <div style={{fontSize:11,color:"var(--text-muted)",fontFamily:"monospace"}}>{p.taxcode}</div>}
                    {p.emails && p.emails[0] && <div style={{fontSize:11,color:"#6366f1",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.emails[0]}</div>}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
      <Modal doc={selectedDoc} onClose={()=>setSelectedDoc(null)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
