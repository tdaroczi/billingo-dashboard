<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Billingo Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet"/>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
      --text: #0f172a; --text-muted: #64748b;
    }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); }
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    select, input { font-family: inherit; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// ── Proxy alap URL – Netlify redirect-en keresztül ──
const BASE = "/billingo-api";


const { useState, useCallback, useEffect } = React;
const { BarChart, Bar, PieChart, Pie, Cell, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

const fmt = (n, cur = "HUF") => n == null ? "–" : new Intl.NumberFormat("hu-HU", { style:"currency", currency:cur, maximumFractionDigits:0 }).format(n);
const fmtDate = d => d ? new Date(d).toLocaleDateString("hu-HU") : "–";

function StatusBadge({ status }) {
  const cfg = { paid:{l:"Fizetve",c:"#d1fae5 #065f46"}, unpaid:{l:"Fizetetlen",c:"#fef3c7 #92400e"}, expired:{l:"Lejárt",c:"#fee2e2 #991b1b"}, cancelled:{l:"Sztornó",c:"#f1f5f9 #475569"}, draft:{l:"Piszkozat",c:"#dbeafe #1e40af"} };
  const s = cfg[status] || {l:status,c:"#f1f5f9 #475569"};
  const [bg, col] = s.c.split(" ");
  return <span style={{background:bg,color:col,padding:"2px 8px",borderRadius:999,fontSize:11,fontWeight:700}}>{s.l}</span>;
}

function KpiCard({ icon, label, value, sub, color }) {
  return (
    <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:20,display:"flex",flexDirection:"column",gap:8}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:"var(--text-muted)"}}>{label}</span>
        <div style={{background:color+"20",borderRadius:10,padding:6,fontSize:18}}>{icon}</div>
      </div>
      <div style={{fontSize:22,fontWeight:800,color:"var(--text)"}}>{value}</div>
      {sub && <div style={{fontSize:12,color:"var(--text-muted)"}}>{sub}</div>}
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [key, setKey] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  const tryLogin = async () => {
    if (!key.trim()) return;
    setLoading(true); setErr("");
    try {
      const r = await fetch(`${BASE}/organization`, { headers: { "X-API-KEY": key, Accept: "application/json" } });
      if (r.status === 401) throw new Error("Érvénytelen API kulcs");
      if (!r.ok) throw new Error(`Hiba: ${r.status}`);
      const org = await r.json();
      onLogin(key, org);
    } catch(e) { setErr(e.message); }
    setLoading(false);
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)"}}>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:24,padding:40,width:"100%",maxWidth:400,boxShadow:"0 20px 60px rgba(0,0,0,0.1)"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{width:64,height:64,borderRadius:16,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"white",fontSize:28,fontWeight:900,display:"inline-flex",alignItems:"center",justifyContent:"center",marginBottom:12}}>B</div>
          <h1 style={{margin:"0 0 8px",color:"var(--text)",fontSize:24,fontWeight:800}}>Billingo Dashboard</h1>
          <p style={{margin:0,color:"var(--text-muted)",fontSize:14}}>Csatlakoztasd Billingo fiókodat az API kulcsoddal</p>
        </div>
        <label style={{fontSize:12,fontWeight:700,color:"var(--text-muted)",display:"block",marginBottom:6}}>API Kulcs (X-API-KEY)</label>
        <input type="password" value={key} onChange={e=>setKey(e.target.value)} onKeyDown={e=>e.key==="Enter"&&tryLogin()} placeholder="Illeszd be a Billingo API kulcsot..."
          style={{width:"100%",padding:"12px 16px",borderRadius:12,border:"1px solid var(--border)",fontSize:14,color:"var(--text)",background:"var(--bg)",boxSizing:"border-box",outline:"none",marginBottom:12}} />
        {err && <div style={{background:"#fee2e2",color:"#991b1b",padding:"8px 12px",borderRadius:8,fontSize:13,marginBottom:12}}>{err}</div>}
        <button onClick={tryLogin} disabled={loading}
          style={{width:"100%",padding:"12px",borderRadius:12,border:"none",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"white",fontWeight:700,fontSize:15,cursor:"pointer"}}>
          {loading ? "Kapcsolódás..." : "Belépés"}
        </button>
        <p style={{fontSize:12,color:"var(--text-muted)",textAlign:"center",marginTop:20}}>
          API kulcsot a <strong>Billingo → Beállítások → API kulcsok</strong> menüpontban hozhatsz létre.
        </p>
      </div>
    </div>
  );
}

function InvoiceRow({ d, onView }) {
  const typeLabel = { invoice:"Számla", proforma:"Díjbekérő", draft:"Piszkozat", advance:"Előleg", receipt:"Nyugta" };
  return (
    <tr style={{borderBottom:"1px solid var(--border)"}}>
      <td style={{padding:"10px 12px",fontFamily:"monospace",fontWeight:700,fontSize:12,color:"var(--text)"}}>{d.invoice_number||"–"}</td>
      <td style={{padding:"10px 12px",fontWeight:600,fontSize:13,color:"var(--text)"}}>{d.partner?.name||"–"}</td>
      <td style={{padding:"10px 12px",fontSize:13,color:"var(--text-muted)"}}>{typeLabel[d.type]||d.type}</td>
      <td style={{padding:"10px 12px",fontSize:13,color:"var(--text-muted)"}}>{fmtDate(d.invoice_date)}</td>
      <td style={{padding:"10px 12px",fontSize:13,color:d.payment_status==="expired"?"#ef4444":"var(--text-muted)"}}>{fmtDate(d.due_date)}</td>
      <td style={{padding:"10px 12px",fontWeight:700,fontSize:13,color:"var(--text)"}}>{fmt(d.summary?.gross_price, d.currency)}</td>
      <td style={{padding:"10px 12px"}}><StatusBadge status={d.payment_status}/></td>
      <td style={{padding:"10px 12px"}}><button onClick={()=>onView(d)} style={{background:"#6366f110",border:"none",borderRadius:8,padding:"4px 8px",color:"#6366f1",cursor:"pointer",fontSize:12}}>👁 Részlet</button></td>
    </tr>
  );
}

function Modal({ doc, onClose }) {
  if (!doc) return null;
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:20,width:"100%",maxWidth:500,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 25px 50px rgba(0,0,0,0.2)"}}>
        <div style={{padding:"20px 24px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontWeight:800,fontSize:17,color:"var(--text)"}}>{doc.invoice_number||"Piszkozat"}</div>
            <div style={{fontSize:13,color:"var(--text-muted)"}}>{doc.partner?.name}</div>
          </div>
          <button onClick={onClose} style={{border:"none",background:"var(--bg)",borderRadius:10,padding:"6px 10px",cursor:"pointer",fontSize:16}}>✕</button>
        </div>
        <div style={{padding:24,display:"flex",flexDirection:"column",gap:16}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[["Típus",doc.type],["Státusz",doc.payment_status],["Kiállítás",fmtDate(doc.invoice_date)],["Lejárat",fmtDate(doc.due_date)],["Fizetve",fmtDate(doc.paid_date)],["Fizetési mód",doc.payment_method]].map(([l,v])=>(
              <div key={l} style={{background:"var(--bg)",borderRadius:10,padding:"10px 12px"}}>
                <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:3}}>{l}</div>
                <div style={{fontWeight:700,fontSize:13,color:"var(--text)"}}>{v||"–"}</div>
              </div>
            ))}
          </div>
          {doc.summary && (
            <div style={{background:"var(--bg)",borderRadius:12,padding:16}}>
              <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:"var(--text-muted)",marginBottom:12}}>Összesítő</div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:14}}><span style={{color:"var(--text-muted)"}}>Nettó</span><span>{fmt(doc.summary.net_price,doc.currency)}</span></div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:12,fontSize:14}}><span style={{color:"var(--text-muted)"}}>ÁFA</span><span>{fmt((doc.summary.gross_price||0)-(doc.summary.net_price||0),doc.currency)}</span></div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:16,fontWeight:800,borderTop:"1px solid var(--border)",paddingTop:12}}><span>Bruttó</span><span style={{color:"#6366f1"}}>{fmt(doc.summary.gross_price,doc.currency)}</span></div>
            </div>
          )}
          <a href={`https://app.billingo.hu/szamlak/${doc.id}`} target="_blank" rel="noreferrer"
            style={{display:"block",textAlign:"center",padding:"12px",borderRadius:12,background:"#6366f1",color:"white",fontWeight:700,textDecoration:"none",fontSize:14}}>
            Megnyitás Billingóban ↗
          </a>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [apiKey, setApiKey] = useState(() => sessionStorage.getItem("billingo_key") || "");
  const [org, setOrg] = useState(null);
  const [docs, setDocs] = useState([]);
  const [partners, setPartners] = useState([]);
  const [loading, setLoading] = useState(false);
  const [tab, setTab] = useState("overview");
  const [selectedDoc, setSelectedDoc] = useState(null);
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");

  const fetchAll = useCallback(async (key) => {
    setLoading(true);
    try {
      const headers = { "X-API-KEY": key, Accept: "application/json" };
      const [orgR, d1, d2, d3, p1, p2] = await Promise.all([
        fetch(`${BASE}/organization`, {headers}).then(r=>r.json()),
        fetch(`${BASE}/documents?per_page=100&page=1`, {headers}).then(r=>r.json()),
        fetch(`${BASE}/documents?per_page=100&page=2`, {headers}).then(r=>r.json()).catch(()=>({data:[]})),
        fetch(`${BASE}/documents?per_page=100&page=3`, {headers}).then(r=>r.json()).catch(()=>({data:[]})),
        fetch(`${BASE}/partners?per_page=100&page=1`, {headers}).then(r=>r.json()),
        fetch(`${BASE}/partners?per_page=100&page=2`, {headers}).then(r=>r.json()).catch(()=>({data:[]})),
      ]);
      setOrg(orgR);
      setDocs([...(d1.data||[]), ...(d2.data||[]), ...(d3.data||[])]);
      setPartners([...(p1.data||[]), ...(p2.data||[])]);
    } catch(e) { console.error(e); }
    setLoading(false);
  }, []);

  const handleLogin = (key, orgData) => {
    sessionStorage.setItem("billingo_key", key);
    setApiKey(key);
    setOrg(orgData);
    fetchAll(key);
  };

  useEffect(() => {
    if (apiKey) fetchAll(apiKey);
  }, []);

  if (!apiKey) return <LoginScreen onLogin={handleLogin} />;

  const paid = docs.filter(d=>d.payment_status==="paid");
  const unpaid = docs.filter(d=>d.payment_status==="unpaid");
  const expired = docs.filter(d=>d.payment_status==="expired");

  const monthly = {};
  paid.forEach(d => {
    const k = (d.paid_date||d.invoice_date||"").substring(0,7);
    if (k) monthly[k] = (monthly[k]||0) + (d.summary?.gross_price||0);
  });
  const monthlyData = Object.entries(monthly).sort().slice(-12).map(([k,v])=>({month:k.replace("-","."), bevétel:Math.round(v)}));

  const statusData = [
    {name:"Fizetve",value:paid.length,color:"#10b981"},
    {name:"Fizetetlen",value:unpaid.length,color:"#f59e0b"},
    {name:"Lejárt",value:expired.length,color:"#ef4444"},
  ].filter(d=>d.value>0);

  const filtered = docs.filter(d => {
    const q = search.toLowerCase();
    return (!q || (d.partner?.name||"").toLowerCase().includes(q) || (d.invoice_number||"").toLowerCase().includes(q))
      && (statusFilter==="all" || d.payment_status===statusFilter);
  });

  const navStyle = (id) => ({
    display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:12,
    cursor:"pointer",border:"none",width:"100%",textAlign:"left",fontSize:14,fontWeight:600,
    background: tab===id?"#6366f120":"transparent",
    color: tab===id?"#6366f1":"var(--text-muted)"
  });

  const selectStyle = {padding:"8px 12px",borderRadius:10,border:"1px solid var(--border)",background:"var(--bg)",color:"var(--text)",fontSize:13,outline:"none"};

  return (
    <div style={{minHeight:"100vh",display:"flex"}}>
      {/* Sidebar */}
      <div style={{width:220,flexShrink:0,background:"var(--card)",borderRight:"1px solid var(--border)",display:"flex",flexDirection:"column",padding:"24px 12px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"0 8px",marginBottom:32}}>
          <div style={{width:36,height:36,borderRadius:10,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"white",fontWeight:900,fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>B</div>
          <div style={{fontWeight:800,fontSize:13,color:"var(--text)"}}>Billingo<br/><span style={{fontWeight:400,fontSize:11,color:"var(--text-muted)"}}>Dashboard</span></div>
        </div>
        {[["overview","📊","Áttekintés"],["invoices","📄","Számlák"],["partners","👥","Partnerek"]].map(([id,ic,lb])=>(
          <button key={id} onClick={()=>setTab(id)} style={navStyle(id)}>{ic} {lb}</button>
        ))}
        <div style={{marginTop:"auto",display:"flex",flexDirection:"column",gap:6}}>
          <button onClick={()=>fetchAll(apiKey)} disabled={loading} style={{...navStyle(""),color:"#6366f1",background:"transparent"}}>
            🔄 {loading?"Töltés...":"Frissítés"}
          </button>
          <button onClick={()=>{sessionStorage.removeItem("billingo_key");setApiKey("");setOrg(null);setDocs([]);setPartners([]);}} style={{...navStyle(""),color:"#ef4444"}}>
            🚪 Kilépés
          </button>
        </div>
      </div>

      {/* Main */}
      <div style={{flex:1,overflow:"auto"}}>
        <div style={{maxWidth:900,margin:"0 auto",padding:"32px 24px"}}>
          <h1 style={{fontSize:22,fontWeight:800,color:"var(--text)",marginBottom:4}}>
            {{"overview":"Áttekintés","invoices":"Számlák","partners":"Partnerek"}[tab]}
          </h1>
          <p style={{color:"var(--text-muted)",fontSize:13,marginBottom:28}}>{docs.length} számla · {partners.length} partner</p>

          {loading && docs.length===0 ? (
            <div style={{textAlign:"center",padding:"80px 0",color:"var(--text-muted)"}}>⏳ Betöltés...</div>
          ) : tab==="overview" ? (
            <div style={{display:"flex",flexDirection:"column",gap:24}}>
              {org && (
                <div style={{background:"linear-gradient(135deg,#6366f1,#8b5cf6)",borderRadius:20,padding:24,color:"white",display:"flex",alignItems:"center",gap:16}}>
                  <div style={{width:52,height:52,borderRadius:14,background:"rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,fontWeight:900}}>{org.name?.[0]||"B"}</div>
                  <div><div style={{fontWeight:800,fontSize:19}}>{org.name}</div><div style={{opacity:.8,fontSize:13}}>{org.tax_number} · {org.address?.city}</div></div>
                </div>
              )}
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:16}}>
                <KpiCard icon="💰" label="Bevétel (fizetve)" value={fmt(paid.reduce((s,d)=>s+(d.summary?.gross_price||0),0))} sub={`${paid.length} kifizetett`} color="#10b981"/>
                <KpiCard icon="⏳" label="Kintlévőség" value={fmt(unpaid.reduce((s,d)=>s+(d.summary?.gross_price||0),0))} sub={`${unpaid.length} fizetetlen`} color="#f59e0b"/>
                <KpiCard icon="🔴" label="Lejárt" value={fmt(expired.reduce((s,d)=>s+(d.summary?.gross_price||0),0))} sub={`${expired.length} db`} color="#ef4444"/>
                <KpiCard icon="👥" label="Partnerek" value={partners.length} sub="aktív ügyfél" color="#6366f1"/>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:20}}>
                <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:20}}>
                  <div style={{fontWeight:700,marginBottom:16,color:"var(--text)"}}>Havi bevétel (fizetve)</div>
                  {monthlyData.length > 0 ? (
                    <ResponsiveContainer width="100%" height={180}>
                      <BarChart data={monthlyData}>
                        <CartesianGrid strokeDasharray="3 3" stroke="var(--border)"/>
                        <XAxis dataKey="month" tick={{fontSize:10,fill:"var(--text-muted)"}}/>
                        <YAxis tick={{fontSize:10,fill:"var(--text-muted)"}} width={55} tickFormatter={v=>(v/1000)+"k"}/>
                        <Tooltip formatter={v=>fmt(v)} contentStyle={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10}}/>
                        <Bar dataKey="bevétel" fill="#6366f1" radius={[6,6,0,0]}/>
                      </BarChart>
                    </ResponsiveContainer>
                  ) : <div style={{height:180,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-muted)",fontSize:13}}>Nincs elég adat</div>}
                </div>
                <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:20}}>
                  <div style={{fontWeight:700,marginBottom:16,color:"var(--text)"}}>Státusz megoszlás</div>
                  <ResponsiveContainer width="100%" height={180}>
                    <PieChart>
                      <Pie data={statusData} cx="50%" cy="50%" outerRadius={75} dataKey="value" label={({name,percent})=>`${name} ${(percent*100).toFixed(0)}%`} labelLine={false} fontSize={11}>
                        {statusData.map((d,i)=><Cell key={i} fill={d.color}/>)}
                      </Pie>
                      <Tooltip contentStyle={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:10}}/>
                    </PieChart>
                  </ResponsiveContainer>
                </div>
              </div>
              {expired.length > 0 && (
                <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:20}}>
                  <div style={{fontWeight:700,marginBottom:12,color:"var(--text)"}}>⚠️ Lejárt számlák</div>
                  {expired.sort((a,b)=>(b.summary?.gross_price||0)-(a.summary?.gross_price||0)).slice(0,5).map(d=>(
                    <div key={d.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid var(--border)"}}>
                      <div>
                        <div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{d.partner?.name||"–"}</div>
                        <div style={{fontSize:11,color:"var(--text-muted)"}}>{d.invoice_number} · Lejárt: {fmtDate(d.due_date)}</div>
                      </div>
                      <div style={{fontWeight:800,color:"#ef4444",fontSize:14}}>{fmt(d.summary?.gross_price,d.currency)}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ) : tab==="invoices" ? (
            <div style={{display:"flex",flexDirection:"column",gap:16}}>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍  Partner vagy számlaszám..." style={{...selectStyle,flex:1,minWidth:200}}/>
                <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={selectStyle}>
                  <option value="all">Minden státusz</option>
                  <option value="paid">Fizetve</option>
                  <option value="unpaid">Fizetetlen</option>
                  <option value="expired">Lejárt</option>
                </select>
                <span style={{fontSize:12,color:"var(--text-muted)",marginLeft:"auto"}}>{filtered.length} db</span>
              </div>
              <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,overflow:"hidden"}}>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse"}}>
                    <thead>
                      <tr style={{borderBottom:"1px solid var(--border)"}}>
                        {["Számlaszám","Partner","Típus","Dátum","Lejárat","Összeg","Státusz",""].map(h=>(
                          <th key={h} style={{padding:"12px",textAlign:"left",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,color:"var(--text-muted)"}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {filtered.length===0 && <tr><td colSpan={8} style={{textAlign:"center",padding:40,color:"var(--text-muted)",fontSize:13}}>Nincs találat</td></tr>}
                      {filtered.map(d=><InvoiceRow key={d.id} d={d} onView={setSelectedDoc}/>)}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          ) : (
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:16}}>
              {partners.map(p=>(
                <div key={p.id} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:16,display:"flex",gap:12}}>
                  <div style={{width:40,height:40,borderRadius:10,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"white",fontWeight:900,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    {(p.name||"?")[0].toUpperCase()}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:13,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div>
                    {p.address && <div style={{fontSize:11,color:"var(--text-muted)",marginTop:2}}>{p.address.city}</div>}
                    {p.taxcode && <div style={{fontSize:11,color:"var(--text-muted)",fontFamily:"monospace"}}>{p.taxcode}</div>}
                    {p.emails?.[0] && <div style={{fontSize:11,color:"#6366f1",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.emails[0]}</div>}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
      <Modal doc={selectedDoc} onClose={()=>setSelectedDoc(null)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
