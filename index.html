<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Billingo MI irányítópult</title>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.7/babel.min.js"></script>
  <script src="./js/demoData.js?v=20260517-mi-radar"></script>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0;
      --text: #0f172a; --text-muted: #64748b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    button { font-family: inherit; }
    select, input { font-family: inherit; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const BASE = "/billingo-api";
const BEMUTATO_MOD = true;

const { useState, useCallback, useEffect } = React;

// ── Magyar fordítások ──
const STATUS_LABEL = {
  paid: "Fizetve", outstanding: "Fizetetlen", unpaid: "Fizetetlen",
  expired: "Lejárt", late: "Késve fizetve", cancelled: "Sztornózva", draft: "Piszkozat",
};
const STATUS_COLOR = {
  paid: "#d1fae5 #065f46", outstanding: "#fef3c7 #92400e", unpaid: "#fef3c7 #92400e",
  expired: "#fee2e2 #991b1b", late: "#fed7aa #9a3412",
  cancelled: "#f1f5f9 #475569", draft: "#dbeafe #1e40af",
};
const TYPE_LABEL = {
  invoice: "Számla", proforma: "Díjbekérő", draft: "Piszkozat",
  advance: "Előlegszámla", receipt: "Nyugta",
  reverse_invoice: "Sztornó", cancel_invoice: "Sztornó",
  modification: "Módosító", modify_invoice: "Módosító",
  corrective_invoice: "Helyesbítő", delivery: "Szállítólevél",
};
const PMETHOD_LABEL = {
  cash: "Készpénz", bankcard: "Bankkártya", online_bankcard: "Online kártya",
  wire_transfer: "Átutalás", transfer: "Átutalás", paypal: "PayPal",
  szep_card: "SZÉP kártya", szep_card_oktatas: "SZÉP (OKJ)",
  szep_card_szabadido: "SZÉP (Szabadidő)", szep_card_vendeglatas: "SZÉP (Vendéglátás)",
  cash_on_delivery: "Utánvét", voucher: "Utalvány", barion: "Barion", barter: "Barter",
  coupon: "Kupon", ep_card: "EP kártya", factoring: "Faktoring",
  prepayment: "Előleg", set_off: "Beszámítás", other: "Egyéb",
  exchange_voucher: "Csere", payu: "PayU", pick_pack_pont: "PickPackPont",
};

const tStatus = s => STATUS_LABEL[s] || s || "–";
const tType = t => TYPE_LABEL[t] || t || "–";
const tPMethod = m => PMETHOD_LABEL[m] || m || "–";
const SEGMENT_LABEL = {
  high_value_late: "nagy érték, késő fizetés",
  growing: "növekvő ügyfél",
  dormant: "újraaktiválandó",
  steady: "stabil ügyfél",
  project: "projektalapú",
  late_small: "kisebb késések",
  high_value: "nagy értékű",
  seasonal: "szezonális",
  missing_email: "hiányos adat"
};
const tSegment = s => SEGMENT_LABEL[s] || "bemutató ügyfél";

const fmt = (n, cur) => {
  if (cur == null) cur = "HUF";
  return n == null ? "–" : new Intl.NumberFormat("hu-HU", { style:"currency", currency:cur, maximumFractionDigits:0 }).format(n);
};
const fmtCompact = (n) => {
  if (n == null) return "–";
  if (Math.abs(n) >= 1000000) return (n/1000000).toFixed(1).replace(".",",") + " M Ft";
  if (Math.abs(n) >= 1000) return Math.round(n/1000) + " e Ft";
  return Math.round(n) + " Ft";
};
const parseDateValue = d => {
  if (!d) return null;
  if (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d)) {
    const [year, month, day] = d.split("-").map(Number);
    return new Date(year, month - 1, day, 12, 0, 0);
  }
  return new Date(d);
};
const getAnalysisDate = () => {
  const generatedAt = BEMUTATO_MOD && window.BILLINGO_DEMO_DATA && window.BILLINGO_DEMO_DATA.generatedAt;
  return generatedAt ? parseDateValue(generatedAt) : new Date();
};
const daysBetween = (later, earlier) => {
  const laterDate = later instanceof Date ? later : parseDateValue(later);
  const earlierDate = earlier instanceof Date ? earlier : parseDateValue(earlier);
  return Math.round((laterDate - earlierDate) / 86400000);
};
const fmtDate = d => d ? parseDateValue(d).toLocaleDateString("hu-HU") : "–";

// ── Robosztus mezőolvasók (AAM/KATA fix) ──
const getNet = d => {
  const s = d.summary || {};
  return s.net_amount || s.net_price || s.net || s.total_net || 0;
};
const getVat = d => {
  const s = d.summary || {};
  return s.vat_amount || s.vat_price || s.vat || s.total_vat || 0;
};
const getGross = d => {
  const s = d.summary || {};
  const gross = s.gross_amount || s.gross_price || s.gross || s.total_gross || s.total || 0;
  if (gross > 0) return gross;
  // AAM/KATA fallback: bruttó = nettó + ÁFA
  return getNet(d) + getVat(d);
};
const getPaidDate = d => d.paid_date || d.paid_at || d.payment_date || null;

const isOutstanding = d => d.payment_status === "outstanding" || d.payment_status === "unpaid";
const isExpired = d => d.payment_status === "expired";
const isPaid = d => d.payment_status === "paid" || d.payment_status === "late";

// ── SVG chart komponensek ──
function BarChartSimple({ data, height }) {
  height = height || 220;
  if (!data || data.length === 0) {
    return <div style={{height,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-muted)",fontSize:13}}>Nincs elég adat</div>;
  }
  const max = Math.max.apply(null, data.map(d => d.value)) || 1;
  const padTop = 15, padBot = 30, padLeft = 60, padRight = 10;
  const W = 520, H = height;
  const innerW = W - padLeft - padRight;
  const innerH = H - padTop - padBot;
  const step = innerW / data.length;
  const barW = step * 0.65;

  const yTicks = [0, 0.25, 0.5, 0.75, 1].map(t => ({
    value: max * t,
    y: padTop + innerH - innerH * t
  }));

  return (
    <svg width="100%" height={H} viewBox={"0 0 " + W + " " + H} preserveAspectRatio="none">
      {yTicks.map((t,i) => (
        <g key={i}>
          <line x1={padLeft} y1={t.y} x2={W - padRight} y2={t.y} stroke="var(--border)" strokeDasharray="3 3"/>
          <text x={padLeft - 5} y={t.y + 3} fontSize="10" fill="var(--text-muted)" textAnchor="end">
            {t.value >= 1000000 ? (t.value/1000000).toFixed(1) + "M" : (t.value/1000).toFixed(0) + "k"}
          </text>
        </g>
      ))}
      {data.map((d, i) => {
        const h = (d.value / max) * innerH;
        const x = padLeft + step * i + (step - barW)/2;
        const y = padTop + innerH - h;
        return (
          <g key={i}>
            <title>{d.label + ": " + fmt(d.value)}</title>
            <rect x={x} y={y} width={barW} height={h} fill={d.color || "#6366f1"} rx="3"/>
            <text x={x + barW/2} y={H - 12} fontSize="10" textAnchor="middle" fill="var(--text-muted)">
              {d.label}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function PieChartSimple({ data, size }) {
  size = size || 180;
  if (!data || data.length === 0) {
    return <div style={{height:size,display:"flex",alignItems:"center",justifyContent:"center",color:"var(--text-muted)",fontSize:13}}>Nincs adat</div>;
  }
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  let cumA = -Math.PI / 2;
  const cx = size / 2, cy = size / 2, r = size / 2 - 5;
  const lr = r * 0.62;

  const slices = data.map((d) => {
    const angle = (d.value / total) * 2 * Math.PI;
    const x1 = cx + r * Math.cos(cumA);
    const y1 = cy + r * Math.sin(cumA);
    const x2 = cx + r * Math.cos(cumA + angle);
    const y2 = cy + r * Math.sin(cumA + angle);
    const largeArc = angle > Math.PI ? 1 : 0;
    const labelA = cumA + angle / 2;
    const lx = cx + lr * Math.cos(labelA);
    const ly = cy + lr * Math.sin(labelA);
    const pct = Math.round((d.value/total)*100);
    let path;
    if (data.length === 1) {
      path = "M " + (cx-r) + " " + cy + " A " + r + " " + r + " 0 1 1 " + (cx+r) + " " + cy + " A " + r + " " + r + " 0 1 1 " + (cx-r) + " " + cy + " Z";
    } else {
      path = "M " + cx + " " + cy + " L " + x1 + " " + y1 + " A " + r + " " + r + " 0 " + largeArc + " 1 " + x2 + " " + y2 + " Z";
    }
    cumA += angle;
    return { path, pct, lx, ly, color: d.color, name: d.name, value: d.value };
  });

  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:20,flexWrap:"wrap"}}>
      <svg width={size} height={size} viewBox={"0 0 " + size + " " + size}>
        {slices.map((s,i) => (
          <g key={i}>
            <title>{s.name + ": " + s.value + " (" + s.pct + "%)"}</title>
            <path d={s.path} fill={s.color}/>
            {s.pct > 7 && (
              <text x={s.lx} y={s.ly} fontSize="11" fontWeight="700" fill="white" textAnchor="middle" dominantBaseline="middle">
                {s.pct + "%"}
              </text>
            )}
          </g>
        ))}
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:6,minWidth:120}}>
        {data.map((d,i) => (
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--text-muted)"}}>
            <div style={{width:12,height:12,borderRadius:3,background:d.color,flexShrink:0}}/>
            <span style={{flex:1}}>{d.name}</span>
            <strong style={{color:"var(--text)"}}>{d.value}</strong>
          </div>
        ))}
      </div>
    </div>
  );
}

function StatusBadge({ status }) {
  const c = STATUS_COLOR[status] || "#f1f5f9 #475569";
  const parts = c.split(" ");
  return <span style={{background:parts[0],color:parts[1],padding:"2px 8px",borderRadius:999,fontSize:11,fontWeight:700}}>{tStatus(status)}</span>;
}

// Hero KPI – kiemelt nagy szám változási jelzéssel
function HeroKpi({ label, value, sub, change, color }) {
  let changeBox = null;
  if (change != null) {
    const positive = change >= 0;
    changeBox = (
      <span style={{
        background: positive ? "#dcfce7" : "#fee2e2",
        color: positive ? "#15803d" : "#991b1b",
        padding:"3px 8px", borderRadius:8, fontSize:12, fontWeight:700, marginLeft:8
      }}>
        {positive ? "▲" : "▼"} {Math.abs(change)}%
      </span>
    );
  }
  return (
    <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:22,display:"flex",flexDirection:"column",gap:6}}>
      <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:"var(--text-muted)"}}>{label}</div>
      <div style={{display:"flex",alignItems:"baseline",flexWrap:"wrap"}}>
        <div style={{fontSize:26,fontWeight:800,color:color || "var(--text)"}}>{value}</div>
        {changeBox}
      </div>
      {sub ? <div style={{fontSize:12,color:"var(--text-muted)"}}>{sub}</div> : null}
    </div>
  );
}

function KpiCard({ icon, label, value, sub, color }) {
  return (
    <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:20,display:"flex",flexDirection:"column",gap:8}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <span style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:"var(--text-muted)"}}>{label}</span>
        <div style={{background:color+"20",borderRadius:10,padding:6,fontSize:18}}>{icon}</div>
      </div>
      <div style={{fontSize:22,fontWeight:800,color:"var(--text)"}}>{value}</div>
      {sub ? <div style={{fontSize:12,color:"var(--text-muted)"}}>{sub}</div> : null}
    </div>
  );
}

function ErrorScreen({ error, onRetry }) {
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,background:"var(--bg)"}}>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:24,padding:40,maxWidth:480,boxShadow:"0 20px 60px rgba(0,0,0,0.08)"}}>
        <div style={{fontSize:48,textAlign:"center",marginBottom:12}}>⚠️</div>
        <h1 style={{margin:"0 0 8px",fontSize:22,fontWeight:800,textAlign:"center"}}>Nem sikerült csatlakozni</h1>
        <p style={{color:"var(--text-muted)",fontSize:14,textAlign:"center",marginTop:0,wordBreak:"break-word"}}>{error || "Ismeretlen hiba"}</p>
        <button onClick={onRetry} style={{width:"100%",padding:"12px",borderRadius:12,border:"none",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"white",fontWeight:700,fontSize:14,cursor:"pointer",marginTop:16}}>
          🔄 Újrapróbálkozás
        </button>
      </div>
    </div>
  );
}

function InvoiceRow({ d, onView }) {
  const emphasis = isExpired(d) ? "Azonnali figyelmet kér" : isOutstanding(d) ? "Nyitott tétel" : isPaid(d) ? "Rendezett" : "Bemutató tétel";
  const emphasisColor = isExpired(d) ? "#ef4444" : isOutstanding(d) ? "#f59e0b" : "#10b981";
  return (
    <tr style={{borderBottom:"1px solid var(--border)"}}>
      <td style={{padding:"10px 12px",fontFamily:"monospace",fontWeight:700,fontSize:12,color:"var(--text)"}}>{d.invoice_number||"–"}</td>
      <td style={{padding:"10px 12px",fontWeight:600,fontSize:13,color:"var(--text)"}}>{(d.partner && d.partner.name) || "–"}</td>
      <td style={{padding:"10px 12px",fontSize:13,color:"var(--text-muted)"}}>{tType(d.type)}</td>
      <td style={{padding:"10px 12px",fontSize:13,color:"var(--text-muted)"}}>{fmtDate(d.invoice_date)}</td>
      <td style={{padding:"10px 12px",fontSize:13,color:isExpired(d)?"#ef4444":"var(--text-muted)"}}>{fmtDate(d.due_date)}</td>
      <td style={{padding:"10px 12px",fontWeight:700,fontSize:13,color:"var(--text)"}}>{fmt(getGross(d), d.currency)}</td>
      <td style={{padding:"10px 12px"}}><StatusBadge status={d.payment_status}/></td>
      <td style={{padding:"10px 12px",fontSize:11,fontWeight:800,color:emphasisColor}}>{emphasis}</td>
      <td style={{padding:"10px 12px"}}><button onClick={()=>onView(d)} style={{background:"#6366f110",border:"none",borderRadius:8,padding:"4px 8px",color:"#6366f1",cursor:"pointer",fontSize:12}}>Megnyitás</button></td>
    </tr>
  );
}

function Modal({ doc, onClose }) {
  const [downloading, setDownloading] = useState(false);
  const [downloadError, setDownloadError] = useState(null);

  if (!doc) return null;

  const downloadPdf = async () => {
    setDownloading(true);
    setDownloadError(null);
    if (BEMUTATO_MOD) {
      setDownloadError("Bemutató módban nincs élő bizonylatmegnyitás. A rendszer fiktív adatokkal fut, ezért nem nyit meg valódi Billingo dokumentumot.");
      setDownloading(false);
      return;
    }
    try {
      const r = await fetch(BASE + "/documents/" + doc.id + "/download");
      if (!r.ok) {
        const txt = await r.text();
        throw new Error("Bizonylat megnyitása sikertelen: " + txt.substring(0,100));
      }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e) {
      setDownloadError(e.message);
    }
    setDownloading(false);
  };

  const net = getNet(doc);
  const vat = getVat(doc);
  const gross = getGross(doc);
  const overdueDays = Math.max(0, daysBetween(getAnalysisDate(), doc.due_date));
  const invoiceExplanation = isExpired(doc)
    ? "Ez a számla lejárt, ezért utánkövetést igényel. A bemutató rendszer ezt a nyitott teendők közé sorolja."
    : isOutstanding(doc)
      ? "Ez a számla még fizetetlen, de a határidő alapján tervezhető beérkezésként jelenik meg."
      : isPaid(doc)
        ? "Ez a számla rendezett tételként számít bele a bevételi és ügyfélérték számításokba."
        : "Ez a bizonylat bemutató célú, ezért nem indít élő számlázási vagy letöltési műveletet.";

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:20,width:"100%",maxWidth:500,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 25px 50px rgba(0,0,0,0.2)"}}>
        <div style={{padding:"20px 24px",borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontWeight:800,fontSize:17,color:"var(--text)"}}>{doc.invoice_number||"Piszkozat"}</div>
            <div style={{fontSize:13,color:"var(--text-muted)"}}>{doc.partner && doc.partner.name}</div>
          </div>
          <button onClick={onClose} style={{border:"none",background:"var(--bg)",borderRadius:10,padding:"6px 10px",cursor:"pointer",fontSize:16}}>✕</button>
        </div>
        <div style={{padding:24,display:"flex",flexDirection:"column",gap:16}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[
              ["Típus", tType(doc.type)],
              ["Státusz", tStatus(doc.payment_status)],
              ["Kiállítás", fmtDate(doc.invoice_date)],
              ["Lejárat", fmtDate(doc.due_date)],
              ["Fizetve", fmtDate(getPaidDate(doc))],
              ["Fizetési mód", tPMethod(doc.payment_method)]
            ].map(([l,v])=>(
              <div key={l} style={{background:"var(--bg)",borderRadius:10,padding:"10px 12px"}}>
                <div style={{fontSize:11,color:"var(--text-muted)",marginBottom:3}}>{l}</div>
                <div style={{fontWeight:700,fontSize:13,color:"var(--text)"}}>{v||"–"}</div>
              </div>
            ))}
          </div>
          <div style={{background:"#eef2ff",border:"1px solid #c7d2fe",borderRadius:12,padding:14}}>
            <div style={{fontSize:11,fontWeight:900,textTransform:"uppercase",letterSpacing:.8,color:"#4338ca",marginBottom:6}}>MI számlamagyarázat</div>
            <div style={{fontSize:13,color:"#312e81",lineHeight:1.55}}>{invoiceExplanation}</div>
            {(isExpired(doc) || isOutstanding(doc)) && (
              <div style={{fontSize:12,color:"#4338ca",marginTop:8,fontWeight:800}}>
                {isExpired(doc) ? overdueDays + " napja lejárt" : "Még nyitott fizetési tétel"} · {fmt(gross, doc.currency)}
              </div>
            )}
          </div>
          <div style={{background:"var(--bg)",borderRadius:12,padding:16}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:"var(--text-muted)",marginBottom:12}}>Összesítő</div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:14}}>
              <span style={{color:"var(--text-muted)"}}>Nettó</span>
              <span>{fmt(net,doc.currency)}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:12,fontSize:14}}>
              <span style={{color:"var(--text-muted)"}}>ÁFA</span>
              <span>{fmt(vat,doc.currency)}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:16,fontWeight:800,borderTop:"1px solid var(--border)",paddingTop:12}}>
              <span>Bruttó</span>
              <span style={{color:"#6366f1"}}>{fmt(gross,doc.currency)}</span>
            </div>
          </div>
          {downloadError && (
            <div style={{background:"#fee2e2",color:"#991b1b",padding:"10px 14px",borderRadius:10,fontSize:13}}>{downloadError}</div>
          )}
          <button onClick={downloadPdf} disabled={downloading}
            style={{padding:"12px",borderRadius:12,background:"#6366f1",color:"white",fontWeight:700,fontSize:14,border:"none",cursor:downloading?"not-allowed":"pointer",opacity:downloading?0.7:1}}>
            {downloading ? "Megnyitás..." : "Bemutató bizonylat megnyitása"}
          </button>
        </div>
      </div>
    </div>
  );
}

// Mini lista row (lejárt / fizetetlen widget-hez)
function MiniInvoiceRow({ d, onClick, color }) {
  return (
    <div onClick={onClick} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid var(--border)",cursor:"pointer"}}>
      <div style={{minWidth:0,flex:1}}>
        <div style={{fontWeight:600,fontSize:13,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{(d.partner && d.partner.name) || "–"}</div>
        <div style={{fontSize:11,color:"var(--text-muted)"}}>{d.invoice_number} · {fmtDate(d.due_date)}</div>
      </div>
      <div style={{fontWeight:800,color:color || "#ef4444",fontSize:14,marginLeft:12}}>{fmt(getGross(d), d.currency)}</div>
    </div>
  );
}

function App() {
  const [org, setOrg] = useState(null);
  const [docs, setDocs] = useState([]);
  const [partners, setPartners] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [tab, setTab] = useState("radar");
  const [selectedDoc, setSelectedDoc] = useState(null);
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [reminderTone, setReminderTone] = useState("baratsagos");

  const fetchAll = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      if (BEMUTATO_MOD) {
        const demo = window.BILLINGO_DEMO_DATA;
        if (!demo) throw new Error("Demo adatmodul nem töltődött be: js/demoData.js");
        setOrg(demo.org);
        setDocs(demo.documents.slice());
        setPartners(demo.partners.slice());
        setLoading(false);
        return;
      }

      const headers = { Accept: "application/json" };
      const safeFetch = async (url) => {
        const r = await fetch(url, {headers});
        if (!r.ok) {
          const txt = await r.text();
          let parsed;
          try { parsed = JSON.parse(txt); } catch (_) { parsed = null; }
          let msg;
          if (!parsed) msg = txt || ("HTTP " + r.status);
          else if (typeof parsed === "string") msg = parsed;
          else if (typeof parsed.error === "string") {
            msg = parsed.error;
            if (parsed.details) msg += " — " + parsed.details;
          }
          else if (parsed.message) msg = parsed.message;
          else msg = JSON.stringify(parsed);
          throw new Error(msg);
        }
        return r.json();
      };

      const docPromises = [];
      for (let p = 1; p <= 8; p++) {
        docPromises.push(safeFetch(BASE + "/documents?per_page=100&page=" + p).catch(()=>({data:[]})));
      }
      const partnerPromises = [];
      for (let p = 1; p <= 5; p++) {
        partnerPromises.push(safeFetch(BASE + "/partners?per_page=100&page=" + p).catch(()=>({data:[]})));
      }

      const [orgR, ...rest] = await Promise.all([safeFetch(BASE + "/organization"), ...docPromises, ...partnerPromises]);
      const docResults = rest.slice(0, 8);
      const partnerResults = rest.slice(8);

      setOrg(orgR);
      const allDocs = [];
      docResults.forEach(r => { if (r && r.data) allDocs.push.apply(allDocs, r.data); });
      const allPartners = [];
      partnerResults.forEach(r => { if (r && r.data) allPartners.push.apply(allPartners, r.data); });
      setDocs(allDocs);
      setPartners(allPartners);
    } catch(e) {
      console.error(e);
      setError(e.message);
    }
    setLoading(false);
  }, []);

  useEffect(() => { fetchAll(); }, [fetchAll]);

  if (error) return <ErrorScreen error={error} onRetry={fetchAll}/>;

  if (loading && !org) {
    return (
      <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
        <div style={{width:48,height:48,borderRadius:14,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:900,fontSize:24}}>B</div>
        <div style={{color:"var(--text-muted)",fontSize:14}}>Billingo adatok betöltése...</div>
      </div>
    );
  }

  // ── Statisztikák ──
  const paid = docs.filter(isPaid);
  const outstanding = docs.filter(isOutstanding);
  const expired = docs.filter(isExpired);

  const totalRevenue = paid.reduce((s,d)=>s+getGross(d),0);
  const totalOutstanding = outstanding.reduce((s,d)=>s+getGross(d),0);
  const totalExpired = expired.reduce((s,d)=>s+getGross(d),0);
  const avgInvoice = paid.length > 0 ? totalRevenue / paid.length : 0;

  // Időablakok
  const now = getAnalysisDate();
  const thisYear = now.getFullYear();
  const lastYear = thisYear - 1;
  const thisMonth = now.getMonth(); // 0-11
  const lastMonthDate = new Date(thisYear, thisMonth - 1, 1);
  const lastMonth = lastMonthDate.getMonth();
  const lastMonthYear = lastMonthDate.getFullYear();

  const inDateRange = (d, year, month) => {
    const dt = getPaidDate(d) || d.invoice_date;
    if (!dt) return false;
    const o = parseDateValue(dt);
    if (month != null) return o.getFullYear() === year && o.getMonth() === month;
    return o.getFullYear() === year;
  };

  // Idei / tavalyi / ehavi / múlt havi (paid)
  const ytdPaid = paid.filter(d => inDateRange(d, thisYear));
  const lastYearPaid = paid.filter(d => inDateRange(d, lastYear));
  const thisMonthPaid = paid.filter(d => inDateRange(d, thisYear, thisMonth));
  const lastMonthPaid = paid.filter(d => inDateRange(d, lastMonthYear, lastMonth));

  const ytdRevenue = ytdPaid.reduce((s,d)=>s+getGross(d),0);
  const lastYearRevenue = lastYearPaid.reduce((s,d)=>s+getGross(d),0);
  const thisMonthRevenue = thisMonthPaid.reduce((s,d)=>s+getGross(d),0);
  const lastMonthRevenue = lastMonthPaid.reduce((s,d)=>s+getGross(d),0);

  // Tavaly ekkor (azonos napig)
  const dayOfYear = Math.floor((now - new Date(thisYear,0,0)) / 86400000);
  const lastYearSamePeriod = lastYearPaid.filter(d => {
    const dt = getPaidDate(d) || d.invoice_date;
    const ly = Math.floor((parseDateValue(dt) - new Date(lastYear,0,0)) / 86400000);
    return ly <= dayOfYear;
  });
  const lastYearSamePeriodRevenue = lastYearSamePeriod.reduce((s,d)=>s+getGross(d),0);

  // Növekedési %
  const yoyChange = lastYearSamePeriodRevenue > 0
    ? Math.round((ytdRevenue - lastYearSamePeriodRevenue) / lastYearSamePeriodRevenue * 100)
    : null;
  const momChange = lastMonthRevenue > 0
    ? Math.round((thisMonthRevenue - lastMonthRevenue) / lastMonthRevenue * 100)
    : null;

  // Fizetési ráta
  const totalRelevant = paid.length + outstanding.length + expired.length;
  const paymentRate = totalRelevant > 0 ? Math.round(paid.length / totalRelevant * 100) : 100;

  // Új ügyfelek ezen a hónapon (akinek először állítottál ki idén számlát ebben a hónapban)
  const partnerFirstInvoice = {};
  docs.forEach(d => {
    const name = (d.partner && d.partner.name) || null;
    if (!name) return;
    const dt = d.invoice_date;
    if (!dt) return;
    if (!partnerFirstInvoice[name] || parseDateValue(dt) < parseDateValue(partnerFirstInvoice[name])) {
      partnerFirstInvoice[name] = dt;
    }
  });
  const newPartnersThisMonth = Object.values(partnerFirstInvoice).filter(dt => {
    const o = parseDateValue(dt);
    return o.getFullYear() === thisYear && o.getMonth() === thisMonth;
  }).length;

  // Havi bevétel (utolsó 12 hónap, fizetve)
  const monthly = {};
  paid.forEach(d => {
    const dt = getPaidDate(d) || d.invoice_date;
    if (!dt) return;
    const k = dt.substring(0,7);
    monthly[k] = (monthly[k]||0) + getGross(d);
  });
  const monthlyData = Object.entries(monthly).sort().slice(-12).map(([k,v])=>{
    const parts = k.split("-");
    return { label: parts[0].substring(2) + "." + parts[1], value: Math.round(v) };
  });

  // Számla típus megoszlás
  const typeCounts = {};
  docs.forEach(d => { if (d.type) typeCounts[d.type] = (typeCounts[d.type]||0) + 1; });
  const TYPE_COLORS = ["#6366f1","#22d3ee","#f59e0b","#10b981","#ef4444","#8b5cf6","#94a3b8"];
  const typeData = Object.entries(typeCounts).map(([k,v],i)=>({
    name: tType(k), value: v, color: TYPE_COLORS[i % TYPE_COLORS.length]
  })).sort((a,b)=>b.value-a.value);

  // Legnagyobb ügyfelek bevétel szerint
  const partnerRevenue = {};
  paid.forEach(d => {
    const name = (d.partner && d.partner.name) || "–";
    if (!partnerRevenue[name]) partnerRevenue[name] = { total: 0, count: 0 };
    partnerRevenue[name].total += getGross(d);
    partnerRevenue[name].count += 1;
  });
  const topPartners = Object.entries(partnerRevenue)
    .map(([name, v]) => ({name, total: v.total, count: v.count}))
    .sort((a,b)=>b.total-a.total)
    .slice(0, 5);
  const partnerProfiles = partners.map(p => {
    const partnerDocs = docs.filter(d => d.partner && d.partner.id === p.id);
    const paidDocs = partnerDocs.filter(isPaid);
    const openDocs = partnerDocs.filter(d => isOutstanding(d) || isExpired(d));
    const latePaidDocs = partnerDocs.filter(d => d.payment_status === "late");
    const total = paidDocs.reduce((s,d)=>s+getGross(d),0);
    const openTotal = openDocs.reduce((s,d)=>s+getGross(d),0);
    const lastInvoiceDate = partnerDocs.reduce((latest,d)=>{
      if (!d.invoice_date) return latest;
      return !latest || parseDateValue(d.invoice_date) > parseDateValue(latest) ? d.invoice_date : latest;
    }, null);
    const daysSinceLastInvoice = lastInvoiceDate ? daysBetween(now, lastInvoiceDate) : null;
    const lateRate = partnerDocs.length > 0 ? Math.round(latePaidDocs.length / partnerDocs.length * 100) : 0;
    let label = tSegment(p.segment);
    let color = "#6366f1";
    let note = "Az ügyfél fiktív bemutatóadatok alapján szerepel ebben a nézetben.";
    if (p.segment === "growing") {
      color = "#10b981";
      note = "Az utóbbi hónapokban növekvő számlaérték látszik, érdemes hosszabb távú együttműködést keresni.";
    } else if (p.segment === "dormant") {
      color = "#f59e0b";
      note = "Korábban aktív ügyfél volt, de régóta nincs új számlázás. Újraaktiváló megkeresés javasolt.";
    } else if (p.segment === "high_value_late" || p.segment === "late_small") {
      color = "#ef4444";
      note = "A fizetési mintázat alapján érdemes előre beállított, udvarias utánkövetést használni.";
    } else if (p.segment === "missing_email") {
      color = "#8b5cf6";
      note = "Hiányzik az email cím, ezért a Billingo nem tudja automatikusan kiküldeni a számlát, és az utánkövetés sem megbízható.";
    } else if (p.segment === "high_value") {
      color = "#0ea5e9";
      note = "Magas értékű ügyfél, akinek a megtartása bevételi szempontból fontos.";
    }
    return { partner:p, docs:partnerDocs, total, count:paidDocs.length, openTotal, lateRate, lastInvoiceDate, daysSinceLastInvoice, label, color, note };
  });
  const growingProfiles = partnerProfiles.filter(p => p.partner.segment === "growing").sort((a,b)=>b.total-a.total).slice(0,3);
  const lateProfiles = partnerProfiles.filter(p => p.lateRate >= 30 || p.partner.segment === "high_value_late" || p.partner.segment === "late_small").sort((a,b)=>b.openTotal-a.openTotal || b.lateRate-a.lateRate).slice(0,5);
  const dormantProfiles = partnerProfiles.filter(p => p.partner.segment === "dormant" || (p.daysSinceLastInvoice != null && p.daysSinceLastInvoice > 90)).sort((a,b)=>(b.daysSinceLastInvoice||0)-(a.daysSinceLastInvoice||0)).slice(0,5);
  const missingEmailProfiles = partnerProfiles.filter(p => !p.partner.emails || !p.partner.emails[0]);
  const followupRiskPartnerCount = new Set(lateProfiles.concat(missingEmailProfiles).map(p => p.partner.id)).size;

  // Státusz pie
  const statusData = [
    {name:"Fizetve", value:paid.length, color:"#10b981"},
    {name:"Fizetetlen", value:outstanding.length, color:"#f59e0b"},
    {name:"Lejárt", value:expired.length, color:"#ef4444"},
  ].filter(d=>d.value>0);

  const openInvoices = expired.concat(outstanding);
  const urgentInvoices = openInvoices.slice().sort((a,b)=>{
    const overdueA = Math.max(0, daysBetween(now, a.due_date));
    const overdueB = Math.max(0, daysBetween(now, b.due_date));
    return (getGross(b) + overdueB * 10000) - (getGross(a) + overdueA * 10000);
  });
  const next30Invoices = outstanding.filter(d => {
    const days = daysBetween(d.due_date, now);
    return days >= 0 && days <= 30;
  });
  const next30Expected = next30Invoices.reduce((s,d)=>s+getGross(d),0);
  const overdueBuckets = [
    {name:"0-7 nap", min:0, max:7, color:"#f59e0b"},
    {name:"8-14 nap", min:8, max:14, color:"#fb923c"},
    {name:"15-30 nap", min:15, max:30, color:"#ef4444"},
    {name:"30+ nap", min:31, max:9999, color:"#991b1b"}
  ].map(bucket => {
    const items = expired.filter(d => {
      const days = Math.max(0, daysBetween(now, d.due_date));
      return days >= bucket.min && days <= bucket.max;
    });
    return Object.assign({}, bucket, {
      count: items.length,
      total: items.reduce((s,d)=>s+getGross(d),0)
    });
  });
  const collectionWeeks = [
    {label:"0-7 nap", min:0, max:7},
    {label:"8-14 nap", min:8, max:14},
    {label:"15-21 nap", min:15, max:21},
    {label:"22-30 nap", min:22, max:30}
  ].map((bucket, index) => {
    const value = outstanding.filter(d => {
      const days = daysBetween(d.due_date, now);
      return days >= bucket.min && days <= bucket.max;
    }).reduce((s,d)=>s+getGross(d),0);
    return { label: bucket.label, value, color: ["#22d3ee","#6366f1","#8b5cf6","#f59e0b"][index] };
  });
  const moneySummary = "A következő 30 napban " + fmtCompact(next30Expected) + " várható beérkezés látszik a nyitott számlák alapján. " +
    "A már lejárt állomány " + fmtCompact(totalExpired) + ", ezért a pénzáramlás legfontosabb javítási pontja az utánkövetés.";
  const topOpenInvoice = urgentInvoices[0] || null;
  const missingEmailPartners = partners.filter(p => !p.emails || !p.emails[0]);
  const growthPartners = partners.filter(p => p.segment === "growing").slice(0,3);
  const dormantPartners = partners.filter(p => p.segment === "dormant").slice(0,3);
  const riskLevel = totalExpired > 1000000 || expired.length >= 3 ? "Figyelmet igényel" : openInvoices.length > 0 ? "Kezelhető" : "Rendben";
  const riskColor = riskLevel === "Figyelmet igényel" ? "#ef4444" : riskLevel === "Kezelhető" ? "#f59e0b" : "#10b981";
  const radarSummary = "A vállalkozás pénzügyi képe alapvetően erős, de a következő napokban a kintlévőség kezelése a legfontosabb. " +
    "A fizetési arány " + paymentRate + "%, miközben " + openInvoices.length + " nyitott számla vár figyelmet. " +
    (topOpenInvoice ? "Elsőként a(z) " + ((topOpenInvoice.partner && topOpenInvoice.partner.name) || "kiemelt ügyfél") + " tételét érdemes kezelni." : "Jelenleg nincs sürgős nyitott számla.");
  const radarInsights = [
    {
      title: "Kintlévőség kezelése",
      text: openInvoices.length + " nyitott számla összesen " + fmtCompact(totalOutstanding + totalExpired) + " értékben. Ebből " + expired.length + " már lejárt.",
      tone: riskLevel,
      color: riskColor
    },
    {
      title: "Bevételi lendület",
      text: "Az idei bevétel " + fmtCompact(ytdRevenue) + ", ami " + (yoyChange == null ? "nem hasonlítható biztosan tavalyhoz" : Math.abs(yoyChange) + "% eltérést mutat tavaly azonos időszakához képest") + ".",
      tone: yoyChange != null && yoyChange >= 0 ? "Erősödés" : "Ellenőrizendő",
      color: yoyChange != null && yoyChange >= 0 ? "#10b981" : "#f59e0b"
    },
    {
      title: "Ügyfélkapcsolati lehetőség",
      text: growthPartners.length + " növekvő ügyfél látszik a bemutató adatokban, miközben " + dormantPartners.length + " korábbi ügyfél újraaktiválható.",
      tone: "Lehetőség",
      color: "#22d3ee"
    },
    {
      title: "Adatminőség",
      text: missingEmailPartners.length > 0 ? missingEmailPartners.length + " ügyfélnél hiányzik az email cím, ezért a Billingo nem tudja automatikusan kiküldeni a számlát." : "A kiemelt ügyfeleknél az utánkövetéshez szükséges kapcsolati adatok megvannak.",
      tone: missingEmailPartners.length > 0 ? "Javítandó" : "Rendben",
      color: missingEmailPartners.length > 0 ? "#f59e0b" : "#10b981"
    }
  ];
  const todaysActions = urgentInvoices.slice(0,3).map((d,i)=>({
    title: (i + 1) + ". " + ((d.partner && d.partner.name) || "Ügyfél") + " utánkövetése",
    text: d.invoice_number + " · " + fmt(getGross(d), d.currency) + " · lejárat: " + fmtDate(d.due_date),
    color: isExpired(d) ? "#ef4444" : "#f59e0b"
  }));
  if (missingEmailPartners.length > 0) {
    todaysActions.push({
      title: "Hiányzó email cím pótlása",
      text: missingEmailPartners[0].name + " ügyfélnél nincs rögzített email cím.",
      color: "#6366f1"
    });
  }
  const actionQueue = urgentInvoices.slice(0,8).map((d,i) => {
    const overdueDays = Math.max(0, daysBetween(now, d.due_date));
    const amount = getGross(d);
    const reasonParts = [];
    if (isExpired(d)) reasonParts.push(overdueDays + " napja lejárt");
    else reasonParts.push("hamarosan esedékes");
    if (amount >= 500000) reasonParts.push("nagy összegű tétel");
    if (d.partner && lateProfiles.some(p => p.partner.id === d.partner.id)) reasonParts.push("az ügyfélnél korábban is látszott fizetési csúszás");
    return {
      doc: d,
      rank: i + 1,
      overdueDays,
      amount,
      reason: reasonParts.join(", ") + ".",
      color: isExpired(d) ? "#ef4444" : "#f59e0b"
    };
  });
  const reminderDoc = actionQueue[0] && actionQueue[0].doc;
  const reminderName = reminderDoc && reminderDoc.partner ? reminderDoc.partner.name : "Ügyfél";
  const reminderAmount = reminderDoc ? fmt(getGross(reminderDoc), reminderDoc.currency) : "az érintett összeg";
  const reminderNumber = reminderDoc ? reminderDoc.invoice_number : "a számla";
  const reminderDueDate = reminderDoc ? fmtDate(reminderDoc.due_date) : "a fizetési határidő";
  const reminderTexts = {
    baratsagos: "Szia! Szeretnék finoman rákérdezni a(z) " + reminderNumber + " számú számlára, amelynek összege " + reminderAmount + ", fizetési határideje pedig " + reminderDueDate + " volt. Lehet, hogy csak elkerülte a figyelmeteket. Meg tudjátok nézni, mikorra várható az utalás?",
    hatarozott: "Kedves " + reminderName + "! A(z) " + reminderNumber + " számú, " + reminderAmount + " összegű számla fizetési határideje " + reminderDueDate + " napján lejárt. Kérlek, jelezzetek vissza, hogy mikorra várható a kiegyenlítés.",
    rovid: "Szia! A(z) " + reminderNumber + " számla (" + reminderAmount + ") fizetési határideje " + reminderDueDate + " volt. Mikorra várható az utalás?"
  };

  // Számla szűrés
  const filtered = docs.filter(d => {
    const q = search.toLowerCase();
    const partnerName = (d.partner && d.partner.name) || "";
    const matchSearch = !q || partnerName.toLowerCase().indexOf(q) >= 0 || (d.invoice_number||"").toLowerCase().indexOf(q) >= 0;
    let matchStatus = statusFilter === "all";
    if (statusFilter === "paid") matchStatus = isPaid(d);
    else if (statusFilter === "outstanding") matchStatus = isOutstanding(d);
    else if (statusFilter === "expired") matchStatus = isExpired(d);
    return matchSearch && matchStatus;
  });

  const navStyle = (id) => ({
    display:"flex", alignItems:"center", gap:10, padding:"10px 14px", borderRadius:12,
    cursor:"pointer", border:"none", width:"100%", textAlign:"left", fontSize:14, fontWeight:600,
    background: tab===id ? "#6366f120" : "transparent",
    color: tab===id ? "#6366f1" : "var(--text-muted)"
  });

  const selectStyle = {padding:"8px 12px",borderRadius:10,border:"1px solid var(--border)",background:"var(--bg)",color:"var(--text)",fontSize:13,outline:"none"};

  const navItems = [
    ["radar","✦","MI Radar"],
    ["money","↗","Pénzmozgás"],
    ["customers","◎","Ügyfélintelligencia"],
    ["actions","✓","Akcióközpont"],
    ["invoices","▤","Számlák"]
  ];
  const tabTitles = {
    radar:"MI Radar",
    money:"Pénzmozgás",
    customers:"Ügyfélintelligencia",
    actions:"Akcióközpont",
    invoices:"Számlák"
  };
  const tabSubtitles = {
    radar:"Mai vezetői helyzetkép fiktív Billingo adatokból.",
    money:"Bevétel, kintlévőség és várható pénzáramlás egy nézetben.",
    customers:"Ügyfélmintázatok, növekedés, késés és lemorzsolódás.",
    actions:"Priorizált teendők és utánkövetési javaslatok.",
    invoices:"Operatív számlalista bemutató adatokkal."
  };
  const cardStyle = {background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:20};

  // Hónap neve
  const MONTH_NAMES = ["jan","feb","már","ápr","máj","jún","júl","aug","szept","okt","nov","dec"];

  return (
    <div style={{minHeight:"100vh",display:"flex"}}>
      <div style={{width:220,flexShrink:0,background:"var(--card)",borderRight:"1px solid var(--border)",display:"flex",flexDirection:"column",padding:"24px 12px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"0 8px",marginBottom:32}}>
          <div style={{width:36,height:36,borderRadius:10,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"white",fontWeight:900,fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>B</div>
          <div style={{fontWeight:800,fontSize:13,color:"var(--text)"}}>Billingo<br/><span style={{fontWeight:400,fontSize:11,color:"var(--text-muted)"}}>Irányítópult</span></div>
        </div>
        {navItems.map(([id,ic,lb])=>(
          <button key={id} onClick={()=>setTab(id)} style={navStyle(id)}>{ic + " " + lb}</button>
        ))}
        <div style={{marginTop:"auto"}}>
          <button onClick={fetchAll} disabled={loading} style={Object.assign({}, navStyle(""), {color:"#6366f1",background:"transparent"})}>
            🔄 {loading ? "Töltés..." : "Frissítés"}
          </button>
        </div>
      </div>

      <div style={{flex:1,overflow:"auto"}}>
        <div style={{maxWidth:1200,margin:"0 auto",padding:"32px 24px"}}>
          <h1 style={{fontSize:22,fontWeight:800,color:"var(--text)",marginBottom:4}}>{tabTitles[tab]}</h1>
          <p style={{color:"var(--text-muted)",fontSize:13,marginBottom:24}}>

              <div style={cardStyle}>
                <div style={{fontWeight:900,fontSize:18,color:"var(--text)",marginBottom:4}}>MI ügyfélprofilok</div>
                <div style={{fontSize:12,color:"var(--text-muted)",marginBottom:16}}>Minden kártya egy rövid, adatból következő értelmezést ad az adott ügyfélről.</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
                {partnerProfiles.map(p=>(
                  <div key={p.partner.id} style={{background:"var(--bg)",border:"1px solid var(--border)",borderLeft:"4px solid " + p.color,borderRadius:14,padding:14,display:"flex",gap:12}}>
                    <div style={{width:40,height:40,borderRadius:10,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"white",fontWeight:900,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      {((p.partner.name||"?")[0]||"").toUpperCase()}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:800,fontSize:13,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.partner.name}</div>
                      {p.partner.address && <div style={{fontSize:11,color:"var(--text-muted)",marginTop:2}}>{p.partner.address.city} · {p.count} fizetett számla · {fmtCompact(p.total)}</div>}
                      <div style={{fontSize:11,color:p.color,marginTop:5,textTransform:"uppercase",fontWeight:900}}>{p.label}</div>
                      <div style={{fontSize:12,color:"var(--text-muted)",lineHeight:1.45,marginTop:6}}>{p.note}</div>
                      {p.partner.emails && p.partner.emails[0] ? (
                        <div style={{fontSize:11,color:"var(--text-muted)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginTop:6}}>{p.partner.emails[0]}</div>
                      ) : (
                        <div style={{fontSize:11,color:"#ef4444",fontWeight:800,marginTop:6}}>Hiányzó email cím</div>
                      )}
                    </div>
                  </div>
                ))}
                </div>
              </div>
            </div>
          )}

          {tab==="actions" && (
            <div style={{display:"flex",flexDirection:"column",gap:20}}>
              <div style={{background:"linear-gradient(135deg,#431407,#7c2d12)",borderRadius:20,padding:22,color:"white",display:"grid",gridTemplateColumns:"1.2fr .8fr",gap:18,alignItems:"center"}}>
                <div>
                  <div style={{fontSize:12,fontWeight:900,letterSpacing:.8,textTransform:"uppercase",color:"#fed7aa",marginBottom:8}}>Akcióközpont</div>
                  <div style={{fontSize:24,fontWeight:900,marginBottom:8}}>Mit érdemes ma megcsinálni?</div>
                  <div style={{fontSize:14,lineHeight:1.7,color:"#ffedd5"}}>
                    A rendszer {actionQueue.length} nyitott tételt rangsorolt. Az első javasolt lépés:
                    {reminderDoc ? " " + reminderName + " utánkövetése, mert " + actionQueue[0].reason : " jelenleg nincs sürgős kintlévőség."}
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <div style={{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.16)",borderRadius:14,padding:14}}>
                    <div style={{fontSize:11,color:"#fed7aa",fontWeight:800,textTransform:"uppercase"}}>Mai teendők</div>
                    <div style={{fontSize:24,fontWeight:900,marginTop:6}}>{actionQueue.length}</div>
                    <div style={{fontSize:11,color:"#ffedd5",marginTop:4}}>rangsorolt tétel</div>
                  </div>
                  <div style={{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.16)",borderRadius:14,padding:14}}>
                    <div style={{fontSize:11,color:"#fecaca",fontWeight:800,textTransform:"uppercase"}}>Azonnali fókusz</div>
                    <div style={{fontSize:24,fontWeight:900,marginTop:6,color:"#fecaca"}}>{fmt(totalExpired)}</div>
                    <div style={{fontSize:11,color:"#fee2e2",marginTop:4}}>{expired.length} lejárt számla</div>
                  </div>
                </div>
              </div>

              <div style={{display:"grid",gridTemplateColumns:"1.15fr .85fr",gap:20}}>
                <div style={cardStyle}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,marginBottom:12}}>
                    <div>
                      <div style={{fontWeight:900,fontSize:18,color:"var(--text)"}}>Mai akciólista</div>
                      <div style={{fontSize:12,color:"var(--text-muted)",marginTop:3}}>Nem csak összeg szerint rendezve: számít a lejárat, az összeg és az ügyfél fizetési mintája is.</div>
                    </div>
                    <div style={{fontSize:12,fontWeight:900,color:"#f59e0b",background:"#f59e0b18",borderRadius:999,padding:"6px 10px"}}>{actionQueue.length} tétel</div>
                  </div>
                  {actionQueue.map(item=>(
                    <div key={item.doc.id} onClick={()=>setSelectedDoc(item.doc)} style={{display:"grid",gridTemplateColumns:"34px 1fr auto",gap:12,alignItems:"center",padding:"13px 0",borderBottom:"1px solid var(--border)",cursor:"pointer"}}>
                      <div style={{width:28,height:28,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",background:item.color+"20",color:item.color,fontWeight:900,fontSize:12}}>{item.rank}</div>
                      <div style={{minWidth:0}}>
                        <div style={{fontWeight:800,fontSize:13,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.doc.partner && item.doc.partner.name}</div>
                        <div style={{fontSize:11,color:"var(--text-muted)"}}>{item.doc.invoice_number} · lejárat: {fmtDate(item.doc.due_date)}</div>
                        <div style={{fontSize:12,color:"var(--text-muted)",lineHeight:1.45,marginTop:4}}>Miért fontos? {item.reason}</div>
                      </div>
                      <div style={{fontWeight:900,color:item.color,fontSize:13}}>{fmt(item.amount, item.doc.currency)}</div>
                    </div>
                  ))}
                </div>

                <div style={cardStyle}>
                  <div style={{fontWeight:900,fontSize:18,marginBottom:4,color:"var(--text)"}}>Fizetési emlékeztető</div>
                  <div style={{fontSize:12,color:"var(--text-muted)",marginBottom:12}}>
                    A szöveg a legmagasabb prioritású nyitott számlához készült, magyar hangnemválasztással.
                  </div>
                  {reminderDoc && (
                    <div style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:12,padding:12,marginBottom:12}}>
                      <div style={{fontWeight:900,fontSize:13,color:"var(--text)"}}>{reminderName}</div>
                      <div style={{fontSize:12,color:"var(--text-muted)",marginTop:3}}>{reminderNumber} · {reminderAmount} · határidő: {reminderDueDate}</div>
                    </div>
                  )}
                  <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
                    {[
                      ["baratsagos","Barátságos"],
                      ["hatarozott","Határozott"],
                      ["rovid","Rövid"]
                    ].map(([id,label])=>(
                      <button key={id} onClick={()=>setReminderTone(id)} style={{
                        border:"1px solid " + (reminderTone===id ? "#6366f1" : "var(--border)"),
                        background: reminderTone===id ? "#6366f115" : "var(--bg)",
                        color: reminderTone===id ? "#6366f1" : "var(--text-muted)",
                        borderRadius:999,
                        padding:"7px 11px",
                        fontSize:12,
                        fontWeight:900,
                        cursor:"pointer"
                      }}>{label}</button>
                    ))}
                  </div>
                  <div style={{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:12,padding:14,color:"var(--text)",fontSize:13,lineHeight:1.65,whiteSpace:"pre-wrap"}}>
                    {reminderDoc ? reminderTexts[reminderTone] : "Jelenleg nincs olyan nyitott számla, amelyhez emlékeztetőt kellene írni."}
                  </div>
                  <div style={{fontSize:12,color:"var(--text-muted)",marginTop:12,lineHeight:1.5}}>
                    Következő éles verzióban ez a szöveg vágólapra másolható, levélbe illeszthető, vagy emberi jóváhagyás után elküldhető.
                  </div>
                </div>
              </div>
            </div>
          )}

          {tab==="invoices" && (
            <div style={{display:"flex",flexDirection:"column",gap:16}}>
              <div style={{background:"linear-gradient(135deg,#111827,#334155)",borderRadius:20,padding:20,color:"white",display:"grid",gridTemplateColumns:"1.2fr .8fr",gap:16,alignItems:"center"}}>
                <div>
                  <div style={{fontSize:12,fontWeight:900,letterSpacing:.8,textTransform:"uppercase",color:"#cbd5e1",marginBottom:8}}>Számlatár</div>
                  <div style={{fontSize:23,fontWeight:900,marginBottom:6}}>Operatív lista élő adatmutogatás nélkül</div>
                  <div style={{fontSize:14,lineHeight:1.6,color:"#e2e8f0"}}>
                    A nézet fiktív számlákat mutat, kereséssel, státuszszűréssel és számlaszintű MI-magyarázattal.
                    Itt ellenőrizhető, miből dolgoznak a vezetői nézetek.
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <div style={{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.16)",borderRadius:14,padding:14}}>
                    <div style={{fontSize:11,color:"#cbd5e1",fontWeight:800,textTransform:"uppercase"}}>Találatok</div>
                    <div style={{fontSize:24,fontWeight:900,marginTop:6}}>{filtered.length}</div>
                    <div style={{fontSize:11,color:"#e2e8f0",marginTop:4}}>szűrt számla</div>
                  </div>
                  <div style={{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.16)",borderRadius:14,padding:14}}>
                    <div style={{fontSize:11,color:"#fecaca",fontWeight:800,textTransform:"uppercase"}}>Lejárt</div>
                    <div style={{fontSize:24,fontWeight:900,marginTop:6,color:"#fecaca"}}>{expired.length}</div>
                    <div style={{fontSize:11,color:"#fee2e2",marginTop:4}}>utánkövetendő tétel</div>
                  </div>
                </div>
              </div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍  Ügyfél vagy számlaszám..." style={Object.assign({}, selectStyle, {flex:1,minWidth:200})}/>
                <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={selectStyle}>
                  <option value="all">Minden státusz</option>
                  <option value="paid">Fizetve</option>
                  <option value="outstanding">Fizetetlen</option>
                  <option value="expired">Lejárt</option>
                </select>
                <span style={{fontSize:12,color:"var(--text-muted)",marginLeft:"auto"}}>{filtered.length} db</span>
              </div>
              <div style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,overflow:"hidden"}}>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse"}}>
                    <thead>
                      <tr style={{borderBottom:"1px solid var(--border)"}}>
                        {["Számlaszám","Ügyfél","Típus","Dátum","Lejárat","Összeg","Státusz","MI jelzés",""].map(h=>(
                          <th key={h} style={{padding:"12px",textAlign:"left",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:.5,color:"var(--text-muted)"}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {filtered.length===0 ? (
                        <tr><td colSpan={9} style={{textAlign:"center",padding:40,color:"var(--text-muted)",fontSize:13}}>Nincs találat</td></tr>
                      ) : filtered.map(d=><InvoiceRow key={d.id} d={d} onView={setSelectedDoc}/>)}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
      <Modal doc={selectedDoc} onClose={()=>setSelectedDoc(null)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
